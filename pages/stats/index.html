<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Statistics - PDF Master Pro</title>
    <link rel="stylesheet" href="../../dashboard/styles.css">
    <style>
        .stats-container {
            padding: 32px;
            max-width: 1000px;
            margin: 0 auto;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 24px;
            margin-bottom: 32px;
        }

        .stat-card {
            background: white;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.05);
            text-align: center;
        }

        .stat-value {
            font-size: 32px;
            font-weight: 700;
            color: var(--primary);
            margin-bottom: 8px;
        }

        .stat-label {
            color: var(--text-muted);
            font-size: 14px;
        }

        .charts-container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 24px;
        }

        .chart-box {
            background: white;
            padding: 24px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        .chart-box h3 {
            margin-bottom: 16px;
            font-size: 16px;
        }

        .bar-chart {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .bar-row {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 13px;
        }

        .bar-label {
            width: 100px;
        }

        .bar-track {
            flex: 1;
            height: 8px;
            background: #F1F5F9;
            border-radius: 4px;
            overflow: hidden;
        }

        .bar-fill {
            height: 100%;
            background: var(--primary);
            border-radius: 4px;
        }

        @media (max-width: 768px) {
            .charts-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div class="stats-container">
            <div style="margin-bottom: 24px;">
                <a href="../../dashboard/index.html"
                    style="text-decoration:none; color:var(--text-muted); display:flex; align-items:center; gap:8px; font-size:14px;">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M19 12H5M12 19l-7-7 7-7" />
                    </svg>
                    Back to Dashboard
                </a>
            </div>

            <h1>Usage Statistics</h1>

            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-value" id="totalFiles">0</div>
                    <div class="stat-label">Files Processed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="totalSize">0 MB</div>
                    <div class="stat-label">Data Saved</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="daysActive">0</div>
                    <div class="stat-label">Days Active</div>
                </div>
            </div>

            <div class="charts-container">
                <div class="chart-box">
                    <h3>Top Tools</h3>
                    <div class="bar-chart" id="topToolsChart">
                        <!-- Populated via JS -->
                    </div>
                </div>

                <div class="chart-box">
                    <h3>Recent Activity</h3>
                    <div id="activityList" style="display: flex; flex-direction: column; gap: 12px;"></div>
                </div>
            </div>
        </div>
    </div>

    <script src="../../utils/storage.js" type="module"></script>
    <script src="stats.js" type="module"></script>
</body>

</html>
