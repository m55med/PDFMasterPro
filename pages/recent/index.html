<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recent Files - PDF Master Pro</title>
    <link rel="stylesheet" href="../../dashboard/styles.css">
    <link rel="stylesheet" href="recent.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <img src="../../assets/icons/icon48.png" alt="PDF Master Pro" class="sidebar-logo">
                <h1 class="sidebar-title">PDF Master Pro</h1>
            </div>

            <nav class="sidebar-nav">
                <ul class="nav-list">
                    <li class="nav-item" data-page="dashboard">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
                            <polyline points="9 22 9 12 15 12 15 22" />
                        </svg>
                        <span data-i18n="dashboard">Dashboard</span>
                    </li>
                    <li class="nav-item" data-page="documents">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M13 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z" />
                            <polyline points="13 2 13 9 20 9" />
                        </svg>
                        <span data-i18n="documents">My Documents</span>
                    </li>
                    <li class="nav-item active" data-page="recent">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="10" />
                            <polyline points="12 6 12 12 16 14" />
                        </svg>
                        <span data-i18n="recent">Recent Files</span>
                    </li>
                    <li class="nav-item" data-page="favorites">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z" />
                        </svg>
                        <span data-i18n="favorites">Favorites</span>
                    </li>
                    <li class="nav-item" data-page="collections">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z" />
                        </svg>
                        <span data-i18n="collections">Collections</span>
                    </li>
                </ul>

                <div class="nav-divider"></div>

                <ul class="nav-list">
                    <li class="nav-item" data-page="statistics">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <line x1="18" y1="20" x2="18" y2="10" />
                            <line x1="12" y1="20" x2="12" y2="4" />
                            <line x1="6" y1="20" x2="6" y2="14" />
                        </svg>
                        <span data-i18n="statistics">Statistics</span>
                    </li>
                    <li class="nav-item" data-page="settings">
                        <svg class="nav-icon" viewBox="0 0 24 24">
                            <circle cx="12" cy="12" r="3" />
                            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z" />
                        </svg>
                        <span data-i18n="settings">Settings</span>
                    </li>
                </ul>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <header class="page-header">
                <div class="header-content">
                    <h1 class="page-title" data-i18n="recent">Recent Files</h1>
                    <p class="page-subtitle" data-i18n="recent_subtitle">Recently accessed PDF files</p>
                </div>
                <div class="header-actions">
                    <button class="btn-icon" id="clearRecent" title="Clear history">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                    </button>
                </div>
            </header>

            <div class="content-main">
                <div class="recent-filters">
                    <div class="time-filters">
                        <button class="filter-btn active" data-filter="all">All Time</button>
                        <button class="filter-btn" data-filter="today">Today</button>
                        <button class="filter-btn" data-filter="week">This Week</button>
                        <button class="filter-btn" data-filter="month">This Month</button>
                    </div>
                    <div class="search-box">
                        <svg class="search-icon" viewBox="0 0 24 24">
                            <circle cx="11" cy="11" r="8"/>
                            <path d="m21 21-4.35-4.35"/>
                        </svg>
                        <input type="text" id="recentSearch" placeholder="Search recent files...">
                    </div>
                </div>

                <div class="recent-timeline" id="recentTimeline">
                    <!-- Timeline will be populated by JS -->
                </div>

                <div class="empty-state" id="emptyState" style="display: none;">
                    <svg class="empty-icon" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="10" />
                        <polyline points="12 6 12 12 16 14" />
                    </svg>
                    <h3>No Recent Files</h3>
                    <p>Your recently accessed files will appear here</p>
                    <a href="../../dashboard/index.html" class="btn-primary">Go to Dashboard</a>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="../../utils/i18n.js"></script>
    <script type="module" src="../../dashboard/components/sidebar.js"></script>
    <script type="module" src="recent.js"></script>
</body>
</html>
