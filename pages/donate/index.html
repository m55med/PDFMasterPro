<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - PDF Master Pro</title>
    <link rel="stylesheet" href="../../dashboard/styles.css">
    <style>
        .donate-container {
            padding: 40px;
            max-width: 600px;
            margin: 40px auto;
            text-align: center;
            background: white;
            border-radius: 16px;
            border: 1px solid var(--border-color);
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .heart-icon {
            color: #EF4444;
            margin-bottom: 24px;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.1);
            }

            100% {
                transform: scale(1);
            }
        }

        h1 {
            margin-bottom: 16px;
        }

        p {
            margin-bottom: 32px;
            color: var(--text-muted);
            line-height: 1.6;
        }

        .donate-btn {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            background: #2563EB;
            color: white;
            padding: 12px 32px;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.2s;
        }

        .donate-btn:hover {
            background: #1D4ED8;
            transform: translateY(-2px);
        }

        .crypto-options {
            margin-top: 32px;
            padding-top: 32px;
            border-top: 1px solid var(--border-color);
        }

        .crypto-addr {
            background: #F1F5F9;
            padding: 12px;
            border-radius: 6px;
            font-family: monospace;
            font-size: 13px;
            margin-bottom: 8px;
            cursor: pointer;
            position: relative;
        }

        .crypto-addr:hover::after {
            content: 'Click to Copy';
            position: absolute;
            right: 12px;
            color: var(--primary);
        }
    </style>
</head>

<body>
    <div class="app-container">
        <div style="position:absolute; top:20px; left:20px;">
            <a href="../../dashboard/index.html"
                style="text-decoration:none; color:var(--text-muted); display:flex; align-items:center; gap:8px; font-size:14px;">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M19 12H5M12 19l-7-7 7-7" />
                </svg>
                Back to Dashboard
            </a>
        </div>

        <div class="donate-container">
            <div class="heart-icon">
                <svg width="64" height="64" viewBox="0 0 24 24" fill="currentColor" stroke="none">
                    <path
                        d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
                </svg>
            </div>

            <h1>Support PDF Master Pro</h1>
            <p>
                PDF Master Pro is free, open-source, and privacy-focused.
                It costs time and coffee to maintain. If you find it useful, consider supporting development!
            </p>

            <a href="#" class="donate-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M20 12V8H6a2 2 0 0 1-2-2c0-1.1.9-2 2-2h12v4" />
                    <path d="M4 6v12c0 1.1.9 2 2 2h14v-4" />
                    <path d="M18 12a2 2 0 0 0-0 4h4v-4h-4z" />
                </svg>
                Donate via PayPal
            </a>

            <div class="crypto-options">
                <h4 style="margin-bottom:16px; color:#64748B;">Or Support via Crypto</h4>
                <div class="crypto-addr" onclick="navigator.clipboard.writeText('0x123...abc')">
                    ETH: 0x123...abc
                </div>
                <div class="crypto-addr" onclick="navigator.clipboard.writeText('bc1q...')">
                    BTC: bc1q...
                </div>
            </div>
        </div>
    </div>
</body>

</html>
