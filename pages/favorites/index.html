<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Favorites - PDF Master Pro</title>
    <link rel="stylesheet" href="../../dashboard/styles.css">
    <link rel="stylesheet" href="../documents/documents.css">
    <link rel="stylesheet" href="favorites.css">
</head>
<body>
    <div class="app-container">
        <!-- Sidebar -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-header">
                <svg class="sidebar-logo" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/>
                    <polyline points="14 2 14 8 20 8"/>
                </svg>
                <span class="sidebar-title" data-i18n="app_name">PDF Master Pro</span>
            </div>

            <nav class="sidebar-nav" id="sidebarNav">
                <a href="../../dashboard/index.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
                    <span data-i18n="dashboard">Dashboard</span>
                </a>
                <a href="../documents/index.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
                    <span data-i18n="my_documents">My Documents</span>
                </a>
                <a href="#" class="nav-item active">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></svg>
                    <span data-i18n="favorites">Favorites</span>
                </a>
                <a href="../collections/index.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>
                    <span data-i18n="collections">Collections</span>
                </a>
                
                <div class="nav-divider"></div>
                
                <a href="../stats/index.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24"><path d="M18 20V10M12 20V4M6 20v-6"/></svg>
                    <span data-i18n="statistics">Statistics</span>
                </a>
                <a href="../settings/index.html" class="nav-item">
                    <svg class="nav-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 1v6m0 6v6m6.364-15.364L16.95 6.05m-9.9 9.9L4.636 18.364m15.364 0l-2.414-2.414m-9.9-9.9L4.636 4.636"/></svg>
                    <span data-i18n="settings">Settings</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Header -->
            <header class="header">
                <button class="header-btn menu-toggle" id="menuToggle">
                    <svg viewBox="0 0 24 24"><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                
                <h1 class="page-title" data-i18n="favorites">Favorites</h1>

                <div class="header-right">
                    <div class="lang-selector-wrapper">
                        <button class="lang-select" id="languageSelect" aria-haspopup="listbox" aria-expanded="false">
                            <img src="https://flagcdn.com/w20/gb.png" alt="English" class="lang-flag" id="currentLangFlag">
                            <span id="currentLangText">English</span>
                            <svg class="lang-select-arrow" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                <path d="M6 9l6 6 6-6"/>
                            </svg>
                        </button>
                        <div class="lang-options" role="listbox" id="languageOptions">
                            <div class="lang-option" data-lang="en" role="option" tabindex="0">
                                <img src="https://flagcdn.com/w20/gb.png" alt="English" class="lang-flag">
                                <span>English</span>
                            </div>
                            <div class="lang-option" data-lang="fr" role="option" tabindex="0">
                                <img src="https://flagcdn.com/w20/fr.png" alt="Français" class="lang-flag">
                                <span>Français</span>
                            </div>
                            <div class="lang-option" data-lang="ar" role="option" tabindex="0">
                                <img src="https://flagcdn.com/w20/sa.png" alt="العربية" class="lang-flag">
                                <span>العربية</span>
                            </div>
                        </div>
                    </div>
                    <button class="header-btn theme-toggle" id="themeToggle" title="Toggle theme">
                        <svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/></svg>
                        <svg class="moon-icon" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
                    </button>
                </div>
            </header>

            <!-- Favorites Content -->
            <div class="content-wrapper">
                <!-- Toolbar -->
                <div class="toolbar">
                    <div class="search-box">
                        <svg class="search-icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
                        <input type="text" placeholder="Search favorites..." id="searchDocs">
                    </div>
                    <div class="toolbar-actions">
                        <span class="favorites-count" id="favCount">0 favorites</span>
                    </div>
                </div>

                <!-- Favorites Grid -->
                <div class="documents-grid" id="favoritesGrid">
                    <!-- Favorites will be loaded here -->
                </div>

                <!-- Empty State -->
                <div class="empty-state" id="emptyState">
                    <svg width="120" height="120" viewBox="0 0 120 120" fill="none">
                        <path d="M80 30a25 25 0 0 0-35 0L60 45l-5-15a25 25 0 0 0-35 35l5 5L60 105l35-35 5-5a25 25 0 0 0 0-35z" fill="#EF4444" opacity="0.2"/>
                        <path d="M80 30a25 25 0 0 0-35 0L60 45l-5-15a25 25 0 0 0-35 35l5 5L60 105l35-35 5-5a25 25 0 0 0 0-35z" stroke="#EF4444" stroke-width="2" fill="none"/>
                    </svg>
                    <h3>No favorites yet</h3>
                    <p>Mark documents as favorites to see them here</p>
                    <a href="../documents/index.html" class="btn-primary">Browse Documents</a>
                </div>
            </div>
        </main>
    </div>

    <script type="module" src="favorites.js"></script>
</body>
</html>
