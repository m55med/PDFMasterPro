<svg width="1024" height="1024" viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Deep, Memorable Background Gradient -->
    <radialGradient id="deepSpace" cx="50%" cy="50%" r="50%" fx="50%" fy="50%">
      <stop offset="0%" stop-color="#4f46e5" /> <!-- Indigo 600 -->
      <stop offset="100%" stop-color="#1e1b4b" /> <!-- Indigo 950 -->
    </radialGradient>
    
    <!-- Gold Gradient for "Master" feel -->
    <linearGradient id="goldHighlight" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="15" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Container -->
  <rect width="1024" height="1024" rx="220" ry="220" fill="url(#deepSpace)" />

  <!-- Orbit Rings (Subconscious "Ecosystem" Trigger) -->
  <g opacity="0.4" fill="none" stroke="white" stroke-width="4" stroke-linecap="round">
    <circle cx="512" cy="512" r="300" stroke-dasharray="20 40" />
    <circle cx="512" cy="512" r="380" stroke-opacity="0.5" stroke-dasharray="10 80" />
  </g>

  <!-- Central Element: The PDF Doc -->
  <g transform="translate(362, 312)">
    <!-- Paper Shape -->
    <path d="M 0 0 L 200 0 L 300 100 L 300 400 L 0 400 Z" fill="white" filter="url(#glow)" />
    <!-- Fold -->
    <path d="M 200 0 L 200 100 L 300 100" fill="#cbd5e1" />
    <!-- PDF Text/Symbol on Paper -->
     <text x="150" y="250" font-family="Arial, sans-serif" font-weight="bold" font-size="120" text-anchor="middle" fill="#1e1b4b">PDF</text>
  </g>

  <!-- Surrounding Tools (The "Master" Tools) -->
  
  <!-- Tool 1: Edit/Pen (Top Right) -->
  <g transform="translate(720, 300)" filter="url(#glow)">
    <circle cx="0" cy="0" r="70" fill="white" opacity="0.1" />
    <path d="M -20 20 L 20 -20 M -20 20 L -30 30 L -10 30 L 30 -10 L 20 -20 Z" stroke="url(#goldHighlight)" stroke-width="12" fill="none" /> <!-- Abstract Pen -->
    <rect x="-10" y="-30" width="40" height="40" transform="rotate(45)" fill="url(#goldHighlight)" />
  </g>

  <!-- Tool 2: Convert/Exchange (Bottom) -->
  <g transform="translate(512, 820)" filter="url(#glow)">
     <circle cx="0" cy="0" r="70" fill="white" opacity="0.1" />
     <!-- Two Arrows forming a cycle -->
     <path d="M -30 -10 A 30 30 0 0 1 30 -10 M 30 10 A 30 30 0 0 1 -30 10" stroke="#38bdf8" stroke-width="12" fill="none" />
     <path d="M 30 -10 L 40 -20 M 30 -10 L 20 -20" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
     <path d="M -30 10 L -40 20 M -30 10 L -20 20" stroke="#38bdf8" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Tool 3: Security/Shield (Top Left) -->
  <g transform="translate(304, 300)" filter="url(#glow)">
    <circle cx="0" cy="0" r="70" fill="white" opacity="0.1" />
    <path d="M -30 -30 L 30 -30 L 30 10 C 30 40 0 60 0 60 C 0 60 -30 40 -30 10 Z" fill="none" stroke="#f472b6" stroke-width="12" stroke-linejoin="round" />
    <circle cx="0" cy="-10" r="8" fill="#f472b6" />
    <path d="M -5 -10 L -5 10 L 5 10 L 5 -10" fill="#f472b6" />
  </g>

</svg>
