<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JPG to PDF - PDF Master Pro</title>
    <link rel="stylesheet" href="../../shared.css">
    <style>
        .image-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            margin-top: 24px;
            width: 100%;
            max-width: 800px;
        }

        .image-card {
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            aspect-ratio: 3/4;
        }

        .image-card img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .image-card .remove-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            background: rgba(255, 255, 255, 0.9);
            border-radius: 50%;
            padding: 4px;
        }

        .settings-panel {
            width: 100%;
            max-width: 800px;
            background: white;
            padding: 20px;
            border-radius: 12px;
            margin-top: 24px;
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
        }

        .setting-group {
            flex: 1;
            min-width: 200px;
        }

        .setting-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #64748B;
            margin-bottom: 8px;
        }

        .setting-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <header class="tool-header">
        <a href="../../../dashboard/index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back
        </a>
        <div class="tool-title">JPG to PDF</div>
        <div class="tool-actions">
            <button class="btn btn-secondary" id="addMoreBtn" disabled>Add Images</button>
            <button class="btn btn-primary" id="convertBtn" disabled>Convert to PDF</button>
        </div>
    </header>

    <main class="tool-container">
        <div class="upload-box" id="uploadArea">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <circle cx="8.5" cy="8.5" r="1.5" />
                    <polyline points="21 15 16 10 5 21" />
                </svg>
            </div>
            <h3>Select Images</h3>
            <p>Supports JPG, PNG</p>
        </div>

        <div class="image-grid hidden" id="imageGrid"></div>

        <div class="settings-panel hidden" id="settingsPanel">
            <div class="setting-group">
                <label>Page Size</label>
                <select id="pageSize">
                    <option value="a4">A4 (210 x 297 mm)</option>
                    <option value="letter">Letter (216 x 279 mm)</option>
                    <option value="fit">Fit to Image</option>
                </select>
            </div>
            <div class="setting-group">
                <label>Margin</label>
                <select id="margin">
                    <option value="none">No Margin</option>
                    <option value="small">Small (10mm)</option>
                    <option value="large">Big (20mm)</option>
                </select>
            </div>
        </div>

        <input type="file" id="fileInput" multiple accept="image/*" hidden>
    </main>

    <script src="../../../lib/pdf-lib.min.js"></script>
    <script src="../../../lib/pdf-processor.js" type="module"></script>
    <script src="../../../utils/notifications.js" type="module"></script>
    <script src="jpg-to-pdf.js" type="module"></script>
</body>

</html>
