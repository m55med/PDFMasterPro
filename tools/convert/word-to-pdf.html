<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Word to PDF - PDF Master Pro</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        .file-preview {
            width: 100%;
            max-width: 800px;
            background: white;
            border-radius: 12px;
            margin-top: 24px;
            padding: 20px;
            display: none;
        }

        .file-preview.active {
            display: block;
        }

        .file-info-card {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 16px;
            background: #F8FAFC;
            border-radius: 8px;
        }

        .file-icon {
            width: 48px;
            height: 48px;
            background: #2563EB;
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-weight: bold;
            font-size: 12px;
        }

        .file-details {
            flex: 1;
        }

        .file-name {
            font-weight: 600;
            color: #0F172A;
            margin-bottom: 4px;
        }

        .file-size {
            font-size: 13px;
            color: #64748B;
        }

        .progress-container {
            margin-top: 20px;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: #E2E8F0;
            border-radius: 4px;
            overflow: hidden;
        }

        .progress-fill {
            height: 100%;
            background: #2563EB;
            border-radius: 4px;
            transition: width 0.3s ease;
            width: 0%;
        }

        .progress-text {
            text-align: center;
            margin-top: 8px;
            font-size: 13px;
            color: #64748B;
        }
    </style>
</head>

<body>
    <header class="tool-header">
        <a href="../../dashboard/index.html" class="back-btn" data-i18n="back_dashboard">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back to Dashboard
        </a>
        <div class="tool-title" data-i18n="tool_word_to_pdf">Word to PDF</div>
        <div class="tool-actions">
            <button class="btn btn-primary" id="convertBtn" disabled>Convert to PDF</button>
        </div>
    </header>

    <main class="tool-container">
        <div class="upload-box" id="uploadArea">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="16" y1="13" x2="8" y2="13" />
                    <line x1="16" y1="17" x2="8" y2="17" />
                    <polyline points="10 9 9 9 8 9" />
                </svg>
            </div>
            <h3>Select Word Document</h3>
            <p>Supports .docx files</p>
        </div>

        <div class="file-preview" id="filePreview">
            <div class="file-info-card">
                <div class="file-icon">DOCX</div>
                <div class="file-details">
                    <div class="file-name" id="fileName">document.docx</div>
                    <div class="file-size" id="fileSize">0 KB</div>
                </div>
                <button class="remove-btn" id="removeBtn">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <line x1="18" y1="6" x2="6" y2="18" />
                        <line x1="6" y1="6" x2="18" y2="18" />
                    </svg>
                </button>
            </div>

            <div class="progress-container" id="progressContainer">
                <div class="progress-bar">
                    <div class="progress-fill" id="progressFill"></div>
                </div>
                <div class="progress-text" id="progressText">Converting...</div>
            </div>
        </div>

        <input type="file" id="fileInput" accept=".docx,.doc" hidden>
    </main>

    <script src="../../lib/pdf-lib.min.js"></script>
    <script src="../../lib/mammoth.min.js"></script>
    <script src="word-to-pdf.js" type="module"></script>
</body>

</html>
