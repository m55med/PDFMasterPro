<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML to PDF - PDF Master Pro</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        .input-section {
            width: 100%;
            max-width: 800px;
            margin-top: 24px;
        }

        .tab-buttons {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .tab-btn {
            padding: 10px 20px;
            border: 1px solid #E2E8F0;
            background: white;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.2s;
        }

        .tab-btn.active {
            background: var(--primary);
            color: white;
            border-color: var(--primary);
        }

        .tab-content {
            display: none;
        }

        .tab-content.active {
            display: block;
        }

        .url-input-group {
            display: flex;
            gap: 12px;
        }

        .url-input-group input {
            flex: 1;
            padding: 12px 16px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            font-size: 14px;
        }

        .html-editor {
            width: 100%;
            height: 300px;
            padding: 16px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            font-family: 'Monaco', 'Menlo', monospace;
            font-size: 13px;
            line-height: 1.5;
            resize: vertical;
        }

        .preview-frame {
            width: 100%;
            height: 400px;
            border: 1px solid #E2E8F0;
            border-radius: 8px;
            margin-top: 16px;
            background: white;
        }

        .settings-row {
            display: flex;
            gap: 16px;
            margin-top: 16px;
        }

        .setting-item {
            flex: 1;
        }

        .setting-item label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            color: #64748B;
            margin-bottom: 6px;
        }

        .setting-item select {
            width: 100%;
            padding: 8px;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
        }

        .progress-container {
            width: 100%;
            max-width: 400px;
            margin-top: 24px;
            padding: 24px;
            background: white;
            border-radius: 12px;
            text-align: center;
            display: none;
        }

        .progress-container.active {
            display: block;
        }

        .progress-bar {
            height: 8px;
            background: #E2E8F0;
            border-radius: 4px;
            overflow: hidden;
            margin-top: 16px;
        }

        .progress-fill {
            height: 100%;
            background: var(--primary);
            width: 0%;
            transition: width 0.3s;
        }
    </style>
</head>

<body>
    <header class="tool-header">
        <a href="../../dashboard/index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back to Dashboard
        </a>
        <div class="tool-title">HTML to PDF</div>
        <div class="tool-actions">
            <button class="btn btn-primary" id="convertBtn" disabled>Convert to PDF</button>
        </div>
    </header>

    <main class="tool-container">
        <div class="upload-box" id="uploadArea">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <polyline points="16 18 22 12 16 6" />
                    <polyline points="8 6 2 12 8 18" />
                    <line x1="12" y1="2" x2="12" y2="22" />
                </svg>
            </div>
            <h3>Select HTML File</h3>
            <p>Or paste HTML code below</p>
        </div>

        <div class="input-section hidden" id="inputSection">
            <div class="tab-buttons">
                <button class="tab-btn active" data-tab="code">HTML Code</button>
                <button class="tab-btn" data-tab="file">File Info</button>
            </div>

            <div class="tab-content active" id="codeTab">
                <textarea class="html-editor" id="htmlCode" placeholder="Paste your HTML code here..."></textarea>
            </div>

            <div class="tab-content" id="fileTab">
                <div class="file-item">
                    <div class="file-info">
                        <div class="file-preview">HTML</div>
                        <div>
                            <div id="fileName">file.html</div>
                            <small id="fileSize" style="color:#64748B">0 KB</small>
                        </div>
                    </div>
                    <button class="remove-btn" id="removeBtn">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <line x1="18" y1="6" x2="6" y2="18" />
                            <line x1="6" y1="6" x2="18" y2="18" />
                        </svg>
                    </button>
                </div>
            </div>

            <div class="settings-row">
                <div class="setting-item">
                    <label>Page Size</label>
                    <select id="pageSize">
                        <option value="a4">A4</option>
                        <option value="letter">Letter</option>
                        <option value="legal">Legal</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Orientation</label>
                    <select id="orientation">
                        <option value="portrait">Portrait</option>
                        <option value="landscape">Landscape</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>Margin</label>
                    <select id="margin">
                        <option value="normal">Normal</option>
                        <option value="narrow">Narrow</option>
                        <option value="none">None</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="progress-container" id="progressContainer">
            <h3>Converting HTML to PDF...</h3>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <p id="progressText" style="margin-top:12px; color:#64748B; font-size:13px;">Processing...</p>
        </div>

        <input type="file" id="fileInput" accept=".html,.htm" hidden>
    </main>

    <script src="../../lib/pdf-lib.min.js"></script>
    <script src="html-to-pdf.js" type="module"></script>
</body>

</html>
