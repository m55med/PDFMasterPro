<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF to JPG - PDF Master Pro</title>
    <link rel="stylesheet" href="../../shared.css">
</head>

<body>
    <header class="tool-header">
        <a href="../../dashboard/index.html" class="back-btn" data-i18n="back_dashboard">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back to Dashboard
        </a>
        <div class="tool-title" data-i18n="tool_pdf_to_jpg">PDF to JPG</div>
        <div class="tool-actions">
            <button class="btn btn-primary" id="convertBtn" data-i18n="tool_pdf_to_jpg" disabled>Convert to JPG</button>
        </div>
    </header>

    <main class="tool-container">
        <div class="upload-box" id="uploadArea">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <circle cx="10" cy="13" r="2" />
                    <path d="M14 17l-2-2-4 4" />
                </svg>
            </div>
            <h3 data-i18n="select_pdf_split">Select PDF</h3>
            <p data-i18n="tool_pdf_to_jpg_desc">Convert pages to images</p>
        </div>

        <div class="file-list hidden" id="fileInfo"></div>

        <div id="statusArea" class="hidden" style="margin-top:20px; text-align:center;">
            <p id="statusText" style="color:#64748B;">Processing...</p>
        </div>

        <input type="file" id="fileInput" accept=".pdf" hidden>
    </main>

    <script src="../../../lib/pdf-lib.min.js"></script>
    <script src="../../../lib/pdf-processor.js" type="module"></script>
    <script src="../../../utils/notifications.js" type="module"></script>

    <!-- PDF.js from Local Lib -->
    <script src="../../lib/pdf.min.js"></script>
    <script src="pdf-to-jpg.js" type="module"></script>
</body>

</html>
