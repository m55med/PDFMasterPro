<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Numbers - PDF Master Pro</title>
    <link rel="stylesheet" href="../../shared.css">
    <style>
        .position-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 12px;
            width: 200px;
            margin: 0 auto;
        }

        .pos-btn {
            width: 48px;
            height: 64px;
            border: 1px solid #E2E8F0;
            border-radius: 4px;
            cursor: pointer;
            position: relative;
            background: white;
        }

        .pos-btn:hover {
            border-color: var(--primary);
        }

        .pos-btn.active {
            border-color: var(--primary);
            background: #EFF6FF;
        }

        /* Indicate position */
        .pos-btn::after {
            content: '1';
            position: absolute;
            font-size: 10px;
            color: #64748B;
        }

        .pos-btn[data-pos="top-left"]::after {
            top: 4px;
            left: 4px;
        }

        .pos-btn[data-pos="top-center"]::after {
            top: 4px;
            left: 50%;
            transform: translateX(-50%);
        }

        .pos-btn[data-pos="top-right"]::after {
            top: 4px;
            right: 4px;
        }

        .pos-btn[data-pos="bottom-left"]::after {
            bottom: 4px;
            left: 4px;
        }

        .pos-btn[data-pos="bottom-center"]::after {
            bottom: 4px;
            left: 50%;
            transform: translateX(-50%);
        }

        .pos-btn[data-pos="bottom-right"]::after {
            bottom: 4px;
            right: 4px;
        }

        .settings-panel {
            width: 100%;
            max-width: 600px;
            background: white;
            padding: 24px;
            border-radius: 12px;
            margin-top: 24px;
            display: flex;
            gap: 32px;
        }

        .col {
            flex: 1;
        }

        select {
            width: 100%;
            padding: 8px;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
        }
    </style>
</head>

<body>
    <header class="tool-header">
        <a href="../../dashboard/index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back
        </a>
        <div class="tool-title">Add Page Numbers</div>
        <div class="tool-actions">
            <button class="btn btn-primary" id="applyBtn" disabled>Add Numbers</button>
        </div>
    </header>

    <main class="tool-container">
        <div class="upload-box" id="uploadArea">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <path d="M10 12h4v6h-4z" />
                </svg>
            </div>
            <h3>Select PDF</h3>
            <p>Insert page numbers</p>
        </div>

        <div class="file-list hidden" id="fileInfo"></div>

        <div class="settings-panel hidden" id="settingsPanel">
            <div class="col" style="text-align: center;">
                <label style="margin-bottom: 12px; display: block;">Position</label>
                <div class="position-grid">
                    <div class="pos-btn" data-pos="top-left"></div>
                    <div class="pos-btn" data-pos="top-center"></div>
                    <div class="pos-btn" data-pos="top-right"></div>
                    <div class="pos-btn" data-pos="bottom-left"></div>
                    <div class="pos-btn active" data-pos="bottom-center"></div>
                    <div class="pos-btn" data-pos="bottom-right"></div>
                </div>
            </div>

            <div class="col">
                <div style="margin-bottom: 20px;">
                    <label style="display:block; margin-bottom:8px;">Format</label>
                    <select id="format">
                        <option value="numeric">1, 2, 3...</option>
                        <option value="roman">i, ii, iii...</option>
                        <option value="alpha">a, b, c...</option>
                    </select>
                </div>
                <div>
                    <label style="display:block; margin-bottom:8px;">Start from</label>
                    <input type="number" id="startFrom" value="1" min="1"
                        style="width:100%; padding:8px; border:1px solid #E2E8F0; border-radius:6px;">
                </div>
            </div>
        </div>

        <input type="file" id="fileInput" accept=".pdf" hidden>
    </main>

    <script src="../../lib/pdf-lib.min.js"></script>
    <script src="../../lib/pdf-processor.js" type="module"></script>
    <script src="../../utils/notifications.js" type="module"></script>
    <script src="page-numbers.js" type="module"></script>
</body>

</html>
