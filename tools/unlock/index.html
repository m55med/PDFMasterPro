<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unlock PDF - PDF Master Pro</title>
    <link rel="stylesheet" href="../../shared.css">
    <style>
        .password-form {
            width: 100%;
            max-width: 400px;
            margin-top: 32px;
            padding: 32px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .lock-icon {
            width: 48px;
            height: 48px;
            background: #FEE2E2;
            color: #EF4444;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 16px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            font-size: 16px;
            margin-top: 16px;
            text-align: center;
        }

        input[type="password"]:focus {
            border-color: #EF4444;
            outline: none;
            box-shadow: 0 0 0 3px rgba(239, 68, 68, 0.1);
        }
    </style>
</head>

<body>
    <header class="tool-header">
        <a href="../../dashboard/index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back
        </a>
        <div class="tool-title">Unlock PDF</div>
        <div class="tool-actions">
            <button class="btn btn-primary" id="unlockBtn" disabled>Unlock PDF</button>
        </div>
    </header>

    <main class="tool-container">
        <div class="upload-box" id="uploadArea">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 9.9-1" />
                </svg>
            </div>
            <h3>Select Protected PDF</h3>
            <p>Remove security settings</p>
        </div>

        <div class="file-list hidden" id="fileInfo"></div>

        <div class="password-form hidden" id="passwordForm">
            <div class="lock-icon">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2" />
                    <path d="M7 11V7a5 5 0 0 1 10 0v4" />
                </svg>
            </div>
            <h3>This file is protected</h3>
            <p style="color:#64748B; font-size:14px;">Enter the password to unlock it permanently</p>

            <input type="password" id="password" placeholder="Enter Password">
        </div>

        <input type="file" id="fileInput" accept=".pdf" hidden>
    </main>

    <script src="../../lib/pdf-lib.min.js"></script>
    <script src="../../lib/pdf-processor.js" type="module"></script>
    <script src="../../utils/notifications.js" type="module"></script>
    <script src="unlock.js" type="module"></script>
</body>

</html>
