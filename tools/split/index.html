<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Split PDF - PDF Master Pro</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        .split-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-top: 24px;
            width: 100%;
            max-width: 800px;
        }

        .option-card {
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            padding: 16px;
            cursor: pointer;
            text-align: center;
            transition: all 0.2s;
        }

        .option-card:hover {
            border-color: var(--primary);
            background: #F8FAFC;
        }

        .option-card.active {
            border-color: var(--primary);
            background: #EFF6FF;
            color: var(--primary);
        }

        .range-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            margin-top: 16px;
            font-family: monospace;
        }

        .preview-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 16px;
            margin-top: 24px;
            width: 100%;
            max-width: 800px;
            max-height: 400px;
            overflow-y: auto;
            padding: 16px;
            background: #F8FAFC;
            border-radius: 8px;
            border: 1px solid #E2E8F0;
        }

        .page-item {
            position: relative;
            background: white;
            border: 1px solid #E2E8F0;
            border-radius: 6px;
            overflow: hidden;
            transition: all 0.2s;
        }

        .page-item:hover {
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            border-color: var(--primary);
        }

        .page-item.deleted {
            opacity: 0.5;
            filter: grayscale(1);
        }

        .page-thumb {
            width: 100%;
            height: 150px;
            object-fit: contain;
            background: #fff;
        }

        .page-number {
            position: absolute;
            bottom: 4px;
            right: 4px;
            background: rgba(0, 0, 0, 0.7);
            color: white;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 4px;
        }

        .delete-page-btn {
            position: absolute;
            top: 4px;
            right: 4px;
            width: 24px;
            height: 24px;
            background: #EF4444;
            color: white;
            border: none;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .page-item:hover .delete-page-btn {
            opacity: 1;
        }

        .delete-page-btn:hover {
            background: #DC2626;
            transform: scale(1.1);
        }
    </style>
</head>

<body>
    <header class="tool-header">
        <a href="../../dashboard/index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back
        </a>
        <div class="tool-title">Split PDF</div>
        <div class="tool-actions">
            <button class="btn btn-primary" id="splitBtn" disabled>Split PDF</button>
        </div>
    </header>

    <main class="tool-container">
        <div class="upload-box" id="uploadArea">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2" />
                    <line x1="12" y1="3" x2="12" y2="21" />
                </svg>
            </div>
            <h3>Select PDF to split</h3>
            <p>Drag and drop or click to upload</p>
        </div>

        <div class="file-list hidden" id="fileInfo"></div>

        <div class="preview-container hidden" id="previewContainer">
            <!-- Grid of pages will go here -->
        </div>

        <div class="split-options hidden" id="optionsPanel">
            <div class="option-card active" data-mode="ranges">
                <h4>Custom Ranges</h4>
                <p style="font-size: 12px">e.g. 1-3, 5-7</p>
            </div>
            <div class="option-card" data-mode="extract">
                <h4>Extract Pages</h4>
                <p style="font-size: 12px">e.g. 2, 4, 9</p>
            </div>
            <div class="option-card" data-mode="all">
                <h4>Split All</h4>
                <p style="font-size: 12px">Every page separately</p>
            </div>
        </div>

        <div class="input-area hidden" id="inputArea" style="width: 100%; max-width: 800px;">
            <input type="text" class="range-input" id="rangeInput" placeholder="Enter ranges (e.g. 1-5, 8, 11-13)">
            <p style="font-size: 12px; color: #64748B; margin-top: 8px;">
                Format examples: "1-5" for range, "1,3,5" for specific pages.
            </p>
        </div>

        <input type="file" id="fileInput" accept=".pdf" hidden>
    </main>

    <!-- Core Libs -->
    <script src="../../lib/pdf-lib.min.js"></script>
    <script src="../../lib/pdf.min.js"></script>

    <script src="../../lib/pdf-processor.js" type="module"></script>
    <script src="../../utils/storage.js" type="module"></script>
    <script src="../../utils/notifications.js" type="module"></script>

    <script src="split.js" type="module"></script>
</body>

</html>
