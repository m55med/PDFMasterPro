<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate PDF - PDF Master Pro</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        .rotate-all-controls {
            display: flex;
            gap: 16px;
            margin-top: 24px;
            justify-content: center;
            align-items: center;
            flex-wrap: wrap;
        }

        .rotate-all-controls span {
            color: #64748B;
            font-size: 14px;
        }

        .rotate-all-btn {
            padding: 8px 16px;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            display: flex;
            align-items: center;
            gap: 8px;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
            font-size: 14px;
        }

        .rotate-all-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #EFF6FF;
        }

        .pages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 24px;
            margin-top: 24px;
            padding: 16px;
        }

        .page-item {
            background: white;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: box-shadow 0.2s;
        }

        .page-item:hover {
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.15);
        }

        .page-thumb-wrapper {
            position: relative;
            background: #F1F5F9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 200px;
            overflow: hidden;
        }

        .page-thumb {
            max-width: 100%;
            max-height: 250px;
            object-fit: contain;
            transition: transform 0.3s ease;
        }

        .rotation-badge {
            position: absolute;
            top: 8px;
            right: 8px;
            background: var(--primary);
            color: white;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 12px;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.2s;
        }

        .rotation-badge.visible {
            opacity: 1;
        }

        .page-controls {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 12px;
            padding: 12px;
            background: #F8FAFC;
            border-top: 1px solid #E2E8F0;
        }

        .page-rotate-btn {
            width: 36px;
            height: 36px;
            border: 2px solid #E2E8F0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
            color: #64748B;
        }

        .page-rotate-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #EFF6FF;
        }

        .page-number {
            font-size: 14px;
            color: #64748B;
            font-weight: 500;
            min-width: 60px;
            text-align: center;
        }

        .reset-rotation-btn {
            font-size: 11px;
            padding: 4px 8px;
            border: 1px solid #E2E8F0;
            border-radius: 4px;
            background: white;
            color: #64748B;
            cursor: pointer;
            transition: all 0.2s;
        }

        .reset-rotation-btn:hover {
            border-color: #EF4444;
            color: #EF4444;
            background: #FEF2F2;
        }
    </style>
</head>

<body>
    <header class="tool-header">
        <a href="../../dashboard/index.html" class="back-btn" data-i18n="btn_back">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back
        </a>
        <div class="tool-title" data-i18n="tool_rotate">Rotate PDF</div>
        <div class="tool-actions">
            <button class="btn btn-primary" id="saveBtn" data-i18n="btn_save_pdf" disabled>Save PDF</button>
        </div>
    </header>

    <main class="tool-container">
        <div class="upload-box" id="uploadArea">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6" />
                    <path d="M1 20v-6h6" />
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                </svg>
            </div>
            <h3 data-i18n="select_pdf_rotate">Select PDF to rotate</h3>
            <p data-i18n="desc_rotate">Rotate pages 90, 180 or 270 degrees</p>
        </div>

        <div class="file-list hidden" id="fileInfo"></div>

        <div class="rotate-all-controls hidden" id="controls">
            <span data-i18n="rotate_all_pages">Rotate all pages:</span>
            <button class="rotate-all-btn" id="rotateAllLeft" title="Rotate All Left" data-i18n-title="rotate_all_left">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>
                <span data-i18n="rotate_left_90">-90°</span>
            </button>
            <button class="rotate-all-btn" id="rotateAllRight" title="Rotate All Right" data-i18n-title="rotate_all_right">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                    <path d="M21 3v5h-5" />
                </svg>
                <span data-i18n="rotate_right_90">+90°</span>
            </button>
            <button class="rotate-all-btn" id="rotateAll180" title="Rotate All 180°">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                    <path d="M21 3v5h-5" />
                </svg>
                <span>180°</span>
            </button>
            <button class="rotate-all-btn" id="resetAll" title="Reset All" style="border-color: #EF4444; color: #EF4444;">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>
                <span data-i18n="reset_all">Reset</span>
            </button>
        </div>

        <div class="pages-grid hidden" id="pagesGrid">
            <!-- Pages will be rendered here -->
        </div>

        <input type="file" id="fileInput" accept=".pdf" hidden>
    </main>

    <script src="../../lib/pdf-lib.min.js"></script>
    <script src="../../lib/pdf.min.js"></script>
    <script src="../../lib/pdf-processor.js" type="module"></script>
    <script src="../../utils/storage.js" type="module"></script>
    <script src="../../utils/notifications.js" type="module"></script>
    <script src="rotate.js" type="module"></script>
</body>

</html>
