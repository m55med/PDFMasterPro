<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rotate PDF - PDF Master Pro</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        .rotate-controls {
            display: flex;
            gap: 16px;
            margin-top: 24px;
            justify-content: center;
        }

        .rotate-btn {
            width: 60px;
            height: 60px;
            border: 2px solid #E2E8F0;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            background: white;
            transition: all 0.2s;
        }

        .rotate-btn:hover {
            border-color: var(--primary);
            color: var(--primary);
            background: #EFF6FF;
        }

        .preview-area {
            width: 100%;
            height: 400px;
            background: #E2E8F0;
            margin-top: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
        }

        .page-preview {
            width: 200px;
            height: 280px;
            background: white;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 24px;
            color: #CBD5E1;
            transition: transform 0.3s ease;
        }
    </style>
</head>

<body>
    <header class="tool-header">
        <a href="../../dashboard/index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back
        </a>
        <div class="tool-title">Rotate PDF</div>
        <div class="tool-actions">
            <button class="btn btn-primary" id="saveBtn" disabled>Save PDF</button>
        </div>
    </header>

    <main class="tool-container">
        <div class="upload-box" id="uploadArea">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M23 4v6h-6" />
                    <path d="M1 20v-6h6" />
                    <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15" />
                </svg>
            </div>
            <h3>Select PDF to rotate</h3>
            <p>Rotate pages 90, 180 or 270 degrees</p>
        </div>

        <div class="file-list hidden" id="fileInfo"></div>

        <div class="rotate-controls hidden" id="controls">
            <button class="rotate-btn" id="rotateLeft" title="Rotate Left">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8" />
                    <path d="M3 3v5h5" />
                </svg>
            </button>
            <button class="rotate-btn" id="rotateRight" title="Rotate Right">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 12a9 9 0 1 1-9-9 9.75 9.75 0 0 1 6.74 2.74L21 8" />
                    <path d="M21 3v5h-5" />
                </svg>
            </button>
        </div>

        <div class="preview-area hidden" id="previewArea">
            <div class="page-preview" id="pagePreview">
                PDF
            </div>
        </div>

        <input type="file" id="fileInput" accept=".pdf" hidden>
    </main>

    <script src="../../lib/pdf-lib.min.js"></script>
    <script src="../../lib/pdf-processor.js" type="module"></script>
    <script src="../../utils/storage.js" type="module"></script>
    <script src="../../utils/notifications.js" type="module"></script>
    <script src="rotate.js" type="module"></script>
</body>

</html>
