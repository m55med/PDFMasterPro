<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Remove Pages - PDF Master Pro</title>
    <link rel="stylesheet" href="../shared.css">
    <style>
        .pages-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 16px;
            width: 100%;
            max-width: 900px;
            margin-top: 24px;
        }

        .page-card {
            background: white;
            border: 2px solid #E2E8F0;
            border-radius: 8px;
            overflow: hidden;
            position: relative;
            cursor: pointer;
            transition: all 0.2s;
        }

        .page-card:hover {
            border-color: #94A3B8;
        }

        .page-card.selected {
            border-color: #EF4444;
            background: #FEF2F2;
        }

        .page-card.selected .delete-overlay {
            display: flex;
        }

        .page-thumb {
            width: 100%;
            aspect-ratio: 3/4;
            background: #F8FAFC;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .page-thumb canvas {
            max-width: 100%;
            max-height: 100%;
        }

        .page-number {
            padding: 8px;
            text-align: center;
            font-size: 13px;
            font-weight: 500;
            color: #64748B;
            border-top: 1px solid #E2E8F0;
        }

        .delete-overlay {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(239, 68, 68, 0.1);
            display: none;
            align-items: center;
            justify-content: center;
        }

        .delete-overlay svg {
            color: #EF4444;
        }

        .selection-info {
            width: 100%;
            max-width: 900px;
            background: #FEF2F2;
            border: 1px solid #FECACA;
            border-radius: 8px;
            padding: 12px 16px;
            margin-top: 16px;
            display: none;
            align-items: center;
            justify-content: space-between;
        }

        .selection-info.active {
            display: flex;
        }

        .selection-info span {
            color: #DC2626;
            font-weight: 500;
        }
    </style>
</head>

<body>
    <header class="tool-header">
        <a href="../../dashboard/index.html" class="back-btn">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M19 12H5M12 19l-7-7 7-7" />
            </svg>
            Back to Dashboard
        </a>
        <div class="tool-title">Remove Pages</div>
        <div class="tool-actions">
            <button class="btn btn-primary" id="removeBtn" disabled>Remove Selected</button>
        </div>
    </header>

    <main class="tool-container">
        <div class="upload-box" id="uploadArea">
            <div class="icon">
                <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z" />
                    <polyline points="14 2 14 8 20 8" />
                    <line x1="9" y1="15" x2="15" y2="15" />
                </svg>
            </div>
            <h3>Select PDF</h3>
            <p>Click on pages to mark them for removal</p>
        </div>

        <div class="selection-info" id="selectionInfo">
            <span><span id="selectedCount">0</span> page(s) selected for removal</span>
            <button class="btn btn-secondary" id="clearSelection" style="padding:6px 12px; font-size:13px;">Clear</button>
        </div>

        <div class="pages-grid hidden" id="pagesGrid"></div>

        <input type="file" id="fileInput" accept=".pdf" hidden>
    </main>

    <script src="../../lib/pdf-lib.min.js"></script>
    <script src="../../lib/pdf.min.js"></script>
    <script src="remove-pages.js" type="module"></script>
</body>

</html>
