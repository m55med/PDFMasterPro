<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Organize PDF - PDF Master Pro</title>
    <link rel="stylesheet" href="../shared.css">
    <link rel="stylesheet" href="organize.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <a href="../../dashboard/index.html" class="back-btn">
                <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"/>
                    <polyline points="12 19 5 12 12 5"/>
                </svg>
                <span data-i18n="back_dashboard">Back to Dashboard</span>
            </a>
            <div class="tool-info">
                <h1>📑 Organize PDF</h1>
                <p>Reorder, duplicate, or remove pages from your PDF</p>
            </div>
        </header>

        <!-- Upload Section -->
        <section class="upload-section" id="uploadSection">
            <div class="upload-area" id="uploadArea">
                <svg viewBox="0 0 24 24" width="48" height="48" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                    <polyline points="17 8 12 3 7 8"/>
                    <line x1="12" y1="3" x2="12" y2="15"/>
                </svg>
                <h3>Drop PDF file here</h3>
                <p>or click to browse</p>
                <input type="file" id="fileInput" accept=".pdf" hidden>
            </div>
        </section>

        <!-- Pages Editor Section -->
        <section class="editor-section" id="editorSection" style="display: none;">
            <div class="editor-toolbar">
                <div class="toolbar-left">
                    <span class="file-name" id="fileName">document.pdf</span>
                    <span class="page-count" id="pageCount">0 pages</span>
                </div>
                <div class="toolbar-right">
                    <button class="btn-secondary" id="selectAllBtn">Select All</button>
                    <button class="btn-secondary" id="deselectAllBtn">Deselect All</button>
                    <button class="btn-danger" id="deleteSelectedBtn">Delete Selected</button>
                </div>
            </div>

            <div class="pages-grid" id="pagesGrid">
                <!-- Pages will be rendered here -->
            </div>

            <div class="actions">
                <button class="btn-secondary" id="cancelBtn">Cancel</button>
                <button class="btn-primary" id="processBtn">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
                        <polyline points="7 10 12 15 17 10"/>
                        <line x1="12" y1="15" x2="12" y2="3"/>
                    </svg>
                    <span>Save Organized PDF</span>
                </button>
            </div>
        </section>

        <!-- Processing Section -->
        <section class="processing-section" id="processingSection" style="display: none;">
            <div class="spinner"></div>
            <h3>Organizing your PDF...</h3>
            <p>Please wait while we process your file</p>
        </section>

        <!-- Result Section -->
        <section class="result-section" id="resultSection" style="display: none;">
            <svg class="success-icon" viewBox="0 0 24 24" width="64" height="64" fill="none" stroke="#10B981" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <polyline points="8 12 11 15 16 9"/>
            </svg>
            <h3>PDF Organized Successfully!</h3>
            <p id="resultMessage">Your PDF has been reorganized</p>
            <div class="result-actions">
                <button class="btn-primary" id="downloadBtn">Download PDF</button>
                <button class="btn-secondary" id="newFileBtn">Organize Another File</button>
            </div>
        </section>
    </div>

    <script type="module" src="organize.js"></script>
</body>
</html>
