<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=320, initial-scale=1.0">
  <title>PDF Master Pro</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="popup-header">
      <div class="logo-section">
        <img src="../assets/icons/icon48.png" alt="PDF Master Pro" class="logo">
        <div class="brand">
          <h1>PDF Master Pro</h1>
          <span class="version" id="version">v1.0.0</span>
        </div>
      </div>
    </header>

    <!-- Quick Tools -->
    <section class="quick-tools">
      <h2>Quick Tools</h2>
      <div class="tools-grid">
        <button class="tool-btn" data-tool="merge">
          <div class="tool-icon merge-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>
            </svg>
          </div>
          <span>Merge PDF</span>
        </button>
        
        <button class="tool-btn" data-tool="split">
          <div class="tool-icon split-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M16 3h5v5M8 3H3v5M3 16v5h5M21 16v5h-5M12 3v18"/>
            </svg>
          </div>
          <span>Split PDF</span>
        </button>
        
        <button class="tool-btn" data-tool="compress">
          <div class="tool-icon compress-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 3v12M8 11l4 4 4-4M4 21h16"/>
            </svg>
          </div>
          <span>Compress</span>
        </button>
        
        <button class="tool-btn" data-tool="convert">
          <div class="tool-icon convert-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M17 1l4 4-4 4M3 11V9a4 4 0 0 1 4-4h14M7 23l-4-4 4-4M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
          </div>
          <span>Convert</span>
        </button>
        
        <button class="tool-btn" data-tool="protect">
          <div class="tool-icon protect-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <span>Protect</span>
        </button>
        
        <button class="tool-btn" data-tool="rotate">
          <div class="tool-icon rotate-icon">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M23 4v6h-6M1 20v-6h6"/>
              <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
            </svg>
          </div>
          <span>Rotate</span>
        </button>
      </div>
    </section>

    <!-- Recent Files -->
    <section class="recent-files">
      <h2>Recent Files</h2>
      <div class="files-list" id="recentFiles">
        <div class="empty-state">
          <p>No recent files</p>
        </div>
      </div>
    </section>

    <!-- Open Dashboard Button -->
    <button class="dashboard-btn" id="openDashboard">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="7" height="7"/>
        <rect x="14" y="3" width="7" height="7"/>
        <rect x="14" y="14" width="7" height="7"/>
        <rect x="3" y="14" width="7" height="7"/>
      </svg>
      Open Full Dashboard
    </button>

    <!-- Footer -->
    <footer class="popup-footer">
      <span>All processing done locally</span>
      <span class="privacy-badge">🔒 100% Private</span>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
